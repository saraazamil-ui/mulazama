name: Manual FTPS deployment

# Intentionally no push, pull_request, schedule or workflow_run deployment.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'check is read-only; deploy requires separate owner approval'
        type: choice
        options:
          - check
          - deploy
        default: check
        required: true
      confirmation:
        description: 'After owner approval only: type DEPLOY mulazama.com'
        type: string
        default: ''
        required: false

permissions:
  contents: read

# Never interrupt an upload midway or allow two publications to overlap.
concurrency:
  group: mulazama-production-ftps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate manual publication intent
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$OPERATION" = deploy ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$CONFIRMATION" = 'DEPLOY mulazama.com'
          else
            test "$OPERATION" = check
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/tests/ftps-deploy.test.py
      - run: pnpm build
      - run: pnpm verify:build
      - run: python3 scripts/ftps-deploy.py validate
      - name: Require existing scientific and engineering release gates
        if: inputs.operation == 'deploy'
        # Exit 2 means Blocked, not approval. Never continue-on-error here.
        run: node scripts/verify-release.mjs --phase 05-C --output /tmp/ftps-release-gates.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  connection:
    name: Read-only explicit FTPS on port 21
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftps-deploy.py check

  publish:
    name: Publish approved dist only
    needs: [build, connection]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'deploy' &&
      inputs.confirmation == 'DEPLOY mulazama.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers in GitHub settings before the first release.
    # The name alone does not create reviewer protection.
    environment:
      name: production-ftps
      url: https://mulazama.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist-${{ github.sha }}
          path: dist/
      - name: Upload only validated build files; never delete remote files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftps-deploy.py deploy --confirm 'DEPLOY mulazama.com'
