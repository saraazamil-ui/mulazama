name: MULAZAMA engineering QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: python3 scripts/verify-06l2.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MULAZAMA-web-evidence
          path: |
            docs/06l2/evidence/
            test-results/
            test-results-offline/
            test-results-deployment/
            playwright-report/
# There is deliberately no deploy step. A passing engineering job is not release approval.
