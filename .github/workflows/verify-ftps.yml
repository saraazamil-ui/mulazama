name: Verify build and read-only FTPS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*ftps.yml'
      - 'scripts/ftps-deploy.py'
      - 'scripts/tests/ftps-deploy.test.py'
  pull_request:
    paths:
      - '.github/workflows/*ftps.yml'
      - 'scripts/ftps-deploy.py'
      - 'scripts/tests/ftps-deploy.test.py'

permissions:
  contents: read

concurrency:
  group: verify-ftps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/tests/ftps-deploy.test.py
      - run: pnpm build
      - run: pnpm verify:build
      - run: python3 scripts/ftps-deploy.py validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  connection:
    name: Read-only explicit FTPS on port 21
    needs: build
    # PR jobs never receive FTP secrets. A trusted repository push or manual
    # dispatch can test the connection, but this workflow has no deploy command.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify TLS, login, relative root and protected passive listing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftps-deploy.py check
